# Reference GitHub Actions workflow for the Feedback Board agent runner (docs/runner-contract.md).
# receiver.example.php turns the package's signed task into this repository_dispatch.
# Copy post-back.sh into this repository as .github/scripts/feedback-post-back.sh.
#
# The agent runs in a job that never references the ingest secret. The agent reads reporter-written
# text, and a prompt-injected agent can read any secret its job's runner holds, or change files and
# environment that later steps of the same job use. Only report-start and post-back get the secret, and
# they run no agent code: each refuses a post-back.sh whose SHA-256 is not POST_BACK_SHA256 below. The
# agent's GITHUB_TOKEN can push a changed script to an unprotected default branch, but it can never
# change this workflow file. This holds only:
#   - on GitHub-hosted (or other single-use) runners, so that no job reuses a machine the agent ran on;
#   - while the agent has no token with the `workflows` permission. Never give it a personal access
#     token or app token that has it: it could rewrite this file and take the secret.
# Pass every value through env. Never write ${{ … }} inside a run: script (expression injection).
name: Feedback Runner

on:
  repository_dispatch:
    types: [feedback_task]

env:
  ITEM_ID: ${{ github.event.client_payload.item.id }}
  TASK_ID: ${{ github.event.client_payload.task_id }}
  POST_BACK: .github/scripts/feedback-post-back.sh
  # SHA-256 of docs/examples/runner/post-back.sh as shipped. If you change your copy, update it:
  # sha256sum .github/scripts/feedback-post-back.sh
  POST_BACK_SHA256: 725a130fe3fbaf1bd2d5b50bef7e84a3f206f3c80b6a0a564b64a63b9d997f1d

jobs:
  report-start:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - name: Report that the agent started
        env:
          INGEST_URL: ${{ secrets.FEEDBACK_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.FEEDBACK_BOARD_INGEST_SECRET }}
        run: echo "$POST_BACK_SHA256  $POST_BACK" | sha256sum --check --quiet - && bash "$POST_BACK" status running

  run-agent:
    needs: report-start
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.agent.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Run the coding agent (Claude Code Action or your tool of choice)
        id: agent
        timeout-minutes: 20 # with the jobs' start-up time, below feedback-board.runner.stale_after (30 minutes by default)
        env:
          ITEM_TITLE: ${{ github.event.client_payload.item.title }}
          ITEM_DESC: ${{ github.event.client_payload.item.description }}
        run: |
          mkdir -p "$RUNNER_TEMP/agent-output"
          # Run your agent here. It writes:
          #   - its analysis to "$RUNNER_TEMP/agent-output/analysis.md" (at most 10,000 characters),
          #   - an optional unified diff to "$RUNNER_TEMP/agent-output/diff.patch" (at most 20,000 characters),
          #   - the pull request link, if it opened one: echo "pr_url=https://…" >> "$GITHUB_OUTPUT"
          echo "Replace this step with your agent." > "$RUNNER_TEMP/agent-output/analysis.md"

      - name: Hand the agent's output to the post-back job
        uses: actions/upload-artifact@v7
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-output/
          retention-days: 1

  post-back:
    needs: run-agent
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        if: always()
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        if: needs.run-agent.result == 'success'
        continue-on-error: true # an agent that wrote no files leaves no artifact; post the result without them
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-output

      - name: Post the result
        if: needs.run-agent.result == 'success'
        env:
          INGEST_URL: ${{ secrets.FEEDBACK_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.FEEDBACK_BOARD_INGEST_SECRET }}
          PR_URL: ${{ needs.run-agent.outputs.pr_url }}
        run: echo "$POST_BACK_SHA256  $POST_BACK" | sha256sum --check --quiet - && bash "$POST_BACK" result "$RUNNER_TEMP/agent-output/analysis.md" "$RUNNER_TEMP/agent-output/diff.patch"

      - name: Report completion
        if: needs.run-agent.result == 'success'
        env:
          INGEST_URL: ${{ secrets.FEEDBACK_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.FEEDBACK_BOARD_INGEST_SECRET }}
        run: echo "$POST_BACK_SHA256  $POST_BACK" | sha256sum --check --quiet - && bash "$POST_BACK" status completed

      - name: Report failure
        if: failure() || cancelled() || needs.run-agent.result != 'success'
        env:
          INGEST_URL: ${{ secrets.FEEDBACK_INGEST_URL }}
          INGEST_SECRET: ${{ secrets.FEEDBACK_BOARD_INGEST_SECRET }}
        run: echo "$POST_BACK_SHA256  $POST_BACK" | sha256sum --check --quiet - && bash "$POST_BACK" status failed agent_failed
